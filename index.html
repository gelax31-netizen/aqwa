<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рыбная Игровая (Catwar Style)</title>
    <!-- Подключаем официальный JS-клиент Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #e0e0e0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Экраны авторизации */
        .auth-container { background: #262626; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); width: 100%; max-width: 400px; text-align: center; border: 1px solid #404040; }
        .auth-container h2 { margin-top: 0; color: #ffffff; font-size: 24px; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .auth-form input { padding: 12px; border-radius: 6px; border: 1px solid #404040; background: #121212; color: #fff; font-size: 14px; }
        .auth-form button { padding: 12px; border: none; border-radius: 6px; background: #4a90e2; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .auth-form button:hover { background: #357abd; }
        .auth-toggle { margin-top: 15px; font-size: 13px; color: #b0b0b0; cursor: pointer; text-decoration: underline; }
        
        /* Экран создания персонажа */
        .creation-container { display: none; background: #262626; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); width: 100%; max-width: 450px; text-align: center; border: 1px solid #404040; }
        .creation-container h2 { margin-top: 0; color: #ffffff; font-size: 24px; border-bottom: 2px solid #404040; padding-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; text-align: left; }
        .form-group label { font-size: 14px; color: #b0b0b0; }
        .form-group input, .form-group select { padding: 12px; border-radius: 6px; border: 1px solid #404040; background: #121212; color: #fff; font-size: 14px; }
        .fish-types { display: flex; gap: 15px; margin-top: 5px; }
        .fish-type-card { flex: 1; background: #121212; border: 2px solid #404040; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .fish-type-card.selected { border-color: #4a90e2; background: #1c2835; }
        .fish-type-card div:first-child { font-size: 32px; margin-bottom: 5px; }
        .start-btn { width: 100%; padding: 14px; border: none; border-radius: 6px; background: #2e7d32; color: white; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; transition: 0.2s; }
        .start-btn:hover { background: #388e3c; }

        /* Главный игровой интерфейс */
        .game-interface { display: none; width: 100%; max-width: 1200px; background: #262626; border-radius: 12px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.7); border: 1px solid #404040; }
        .game-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #404040; padding-bottom: 15px; margin-bottom: 15px; }
        .game-title { font-size: 22px; font-weight: bold; color: #ffffff; }
        .profile-btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #4a90e2; color: white; transition: 0.2s; }
        .profile-btn:hover { background: #357abd; }

        .game-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* Игровая зона и огромная сетка */
        .game-area { flex: 2; min-width: 500px; }
        .location-banner { background: #404040; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 15px; color: #fff; }
        
        /* Сетка перемещения 10x10 */
        .grid-map { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); gap: 2px; background: #121212; padding: 4px; border-radius: 8px; aspect-ratio: 1; border: 4px solid #404040; }
        .grid-cell { background: #222222; border-radius: 2px; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; transition: background 0.15s; position: relative; user-select: none; }
        .grid-cell:hover { background: #333333; }
        .grid-cell.portal { background: #2c1a3d; border: 1px dashed #8e44ad; }
        .grid-cell.portal::after { content: "🚪"; font-size: 11px; position: absolute; bottom: 1px; right: 2px; }

        /* Панели управления */
        .sidebar { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 15px; }
        .panel-box { background: #1e1e1e; border-radius: 8px; padding: 15px; border: 1px solid #404040; }
        .panel-box h3 { margin-top: 0; margin-bottom: 12px; font-size: 15px; color: #b0b0b0; border-bottom: 1px solid #404040; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Жизненные показатели */
        .stat-row { margin-bottom: 10px; }
        .stat-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        .stat-bar-bg { background: #121212; border-radius: 4px; height: 10px; width: 100%; overflow: hidden; }
        .stat-bar-fill { height: 100%; width: 100%; transition: width 0.3s; }
        .bar-health { background: #c62828; }
        .bar-hunger { background: #ef6c00; }
        .bar-fatigue { background: #2e7d32; }
        .bar-oxygen { background: #0277bd; }

        /* Навыки */
        .skill-row { margin-bottom: 12px; }
        .skill-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
        .skill-bar-bg { background: #121212; border-radius: 4px; height: 8px; width: 100%; overflow: hidden; }
        .skill-bar-fill { height: 100%; width: 0%; background: #4a90e2; transition: width 0.2s; }

        /* Действия и таймеры */
        .actions-list { display: flex; flex-direction: column; gap: 8px; }
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #333333; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; text-align: left; }
        .action-btn:hover:not(:disabled) { background: #444444; }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .timer-banner { background: #d84315; color: white; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 10px; display: none; }

        /* Профиль */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .profile-modal { background: #262626; border-radius: 12px; width: 90%; max-width: 450px; padding: 25px; border: 1px solid #404040; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .profile-avatar { font-size: 56px; text-align: center; margin-bottom: 15px; background: #121212; padding: 15px; border-radius: 50%; width: 100px; height: 100px; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; border: 2px solid #4a90e2; }
        .profile-info-list { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .profile-info-list li { padding: 10px 0; border-bottom: 1px solid #333; font-size: 15px; display: flex; justify-content: space-between; }
        .profile-info-list li span { color: #b0b0b0; }
    </style>
</head>
<body>

    <!-- БЛОК АВТОРИЗАЦИИ (Вход / Регистрация) -->
    <div id="authContainer" class="auth-container">
        <h2 id="authTitle">Вход в Игру</h2>
        <form id="authForm" class="auth-form">
            <input type="email" id="authEmail" placeholder="Ваша электронная почта" required>
            <input type="password" id="authPassword" placeholder="Пароль (от 6 символов)" required>
            <button type="submit" id="authSubmitBtn">Войти</button>
        </form>
        <div id="authToggleBtn" class="auth-toggle">Ещё нет аккаунта? Зарегистрироваться</div>
    </div>

    <!-- ЭКРАН СОЗДАНИЯ РЫБКИ -->
    <div id="creationContainer" class="creation-container">
        <h2>Создание персонажа</h2>
        <div class="form-group">
            <label for="fishName">Имя рыбки:</label>
            <input type="text" id="fishName" placeholder="Введите имя..." maxlength="14" value="Рыбчик">
        </div>
        <div class="form-group">
            <label for="fishGender">Пол:</label>
            <select id="fishGender">
                <option value="самец">Самец</option>
                <option value="самка">Самка</option>
            </select>
        </div>
        <div class="form-group">
            <label>Вид рыбы:</label>
            <div class="fish-types">
                <div id="typeKoi" class="fish-type-card selected" onclick="selectFishType('koi')">
                    <div>🐟</div>
                    <strong>Кои</strong>
                </div>
                <div id="typeCatfish" class="fish-type-card" onclick="selectFishType('catfish')">
                    <div>🐡</div>
                    <strong>Сом</strong>
                </div>
            </div>
        </div>
        <button class="start-btn" onclick="saveNewFishData()">Создать и войти в игру</button>
    </div>

    <!-- ГЛАВНЫЙ ИГРОВОЙ ЭКРАН -->
    <div id="gameInterface" class="game-interface">
        <div class="game-header">
            <div class="game-title">Рыбная Игровая</div>
            <button class="profile-btn" onclick="openProfile()">👤 Профиль</button>
        </div>
