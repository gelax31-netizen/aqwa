<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рыбная Игровая (Catwar Style)</title>
    <style>
        body {
            font-family: Verdana, Arial, sans-serif;
            background-color: #f0f3f5;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        #game-container {
            display: flex;
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        #left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-right: 20px;
        }
        #right-panel {
            width: 280px;
            border-left: 1px solid #ddd;
            padding-left: 20px;
        }
        h2 {
            font-size: 18px;
            color: #333;
            margin-top: 0;
            border-bottom: 2px solid #70a1ff;
            padding-bottom: 5px;
        }
        #location-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2f3542;
        }
        /* Сетка как в Кэтваре */
        #grid {
            position: relative;
            display: grid;
            grid-template-columns: repeat(6, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 1px;
            background-color: #dfe4ea;
            border: 2px solid #a4b0be;
            width: 365px;
            height: 365px;
            margin-bottom: 15px;
        }
        .cell {
            background-color: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .cell:hover {
            background-color: #e4e7eb;
        }
        .cell.sea { background-color: #e0f7fa; }
        .cell.river { background-color: #e1f5fe; }
        
        /* Моделька игрока */
        #player {
            width: 45px;
            height: 45px;
            background-color: #ff4757;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            position: absolute;
            transition: all 0.2s ease;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        /* Панель действий */
        #actions-panel {
            background: #f1f2f6;
            border: 1px solid #ced6e0;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #70a1ff;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-right: 5px;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn:hover { background-color: #1e90ff; }
        .btn:active { background-color: #3742fa; }

        /* Лог переходов */
        #move-actions {
            margin-top: 5px;
        }

        /* Навыки справа */
        .stat-box {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .stat-title {
            font-size: 13px;
            font-weight: bold;
            color: #57606f;
        }
        .progress-bar {
            background-color: #ced6e0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            background-color: #2ed573;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        /* Модальное окно профиля прямо в игровой */
        #profile-modal {
            display: none; 
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid #2f3542;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            width: 320px;
            padding: 20px;
            border-radius: 8px;
        }
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 99;
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-weight: bold;
            color: #ff4757;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- ЛЕВАЯ ЧАСТЬ: Игровая, сетка, действия -->
    <div id="left-panel">
        <div id="location-title">Локация: <span id="loc-name">Коралловый Риф</span></div>
        
        <!-- Сетка перемещения -->
        <div id="grid">
            <div id="player">🐟</div>
            <!-- Клетки сгенерируются через JS -->
        </div>

        <!-- Действия -->
        <div id="actions-panel">
            <div style="font-weight: bold; margin-bottom: 5px; font-size: 14px;">Доступные действия:</div>
            <button class="btn" onclick="doAction('swim')">Плавать</button>
            <button class="btn" onclick="doAction('look')">Присмотреться</button>
            
            <div id="move-actions">
                <!-- Кнопка перехода появится тут, если игрок на нужной клетке -->
            </div>
        </div>
        
        <div>
            <button class="btn" style="background-color: #ffa502;" onclick="toggleProfile(true)">Открыть профиль персонажа</button>
        </div>
    </div>

    <!-- ПРАВАЯ ЧАСТЬ: Параметры как в Кэтвар -->
    <div id="right-panel">
        <h2>Ваш Персонаж</h2>
        <div style="text-align: center; margin-bottom: 15px;">
            <div style="font-size: 36px;">🐟</div>
            <div style="font-weight: bold; margin-top: 5px;">Карась_Облачный</div>
        </div>

        <h2>Навыки</h2>
        <div class="stat-box">
            <div class="stat-title">Выносливость: <span id="txt-stamina">0</span>/100</div>
            <div class="progress-bar"><div id="bar-stamina" class="progress-fill"></div></div>
        </div>
        <div class="stat-box">
            <div class="stat-title">Внимательность: <span id="txt-perception">0</span>/100</div>
            <div class="progress-bar"><div id="bar-perception" class="progress-fill"></div></div>
        </div>
    </div>
</div>

<!-- Модальное окно профиля персонажа -->
<div id="modal-overlay" onclick="toggleProfile(false)"></div>
<div id="profile-modal">
    <span class="close-btn" onclick="toggleProfile(false)">[X]</span>
    <h3 style="margin-top: 0; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Профиль Рыбы</h3>
    <p><strong>Имя:</strong> Карась_Облачный</p>
    <p><strong>Вид:</strong> Золотая рыбка</p>
    <p><strong>Статус:</strong> Исследователь глубин</p>
    <hr>
    <p><strong>Текущие навыки:</strong></p>
    <ul>
        <li>Выносливость: <span id="prof-stamina">0</span></li>
        <li>Внимательность: <span id="prof-perception">0</span></li>
    </ul>
</div>

<script>
    // Настройки игрового мира
    const gridSize = 6;
    const cellSize = 61; // 60px + 1px gap
    
    // Координаты игрока (x: 0..5, y: 0..5)
    let playerX = 2;
    let playerY = 2;
    
    // Навыки
    let stats = {
        stamina: 0,
        perception: 0
    };

    // Локации
    let currentLoc = 'reef'; // 'reef' или 'abyss'
    const locations = {
        reef: {
            name: "Коралловый Риф",
            bgClass: "sea",
            transitionCell: {x: 5, y: 5}, // Клетка перехода
            targetLoc: "abyss",
            transitionText: "Уплыть в Морскую Бездну"
        },
        abyss: {
            name: "Морская Бездна",
            bgClass: "river",
            transitionCell: {x: 0, y: 0}, // Клетка перехода туда-сюда
            targetLoc: "reef",
            transitionText: "Вернуться на Коралловый Риф"
        }
    };

    const gridEl = document.getElementById('grid');
    const playerEl = document.getElementById('player');

    // Генерация сетки
    function initGrid() {
        // Удаляем старые клетки (оставляя плеер)
        const cells = gridEl.querySelectorAll('.cell');
        cells.forEach(c => c.remove());

        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                const cell = document.createElement('div');
                cell.className = `cell ${locations[currentLoc].bgClass}`;
                
                // Подсветка точки перехода как на Кэтваре (звезда или символ)
                let locData = locations[currentLoc];
                if(x === locData.transitionCell.x && y === locData.transitionCell.y) {
                    cell.innerHTML = "<span style='color: #ffa502; font-weight:bold;'>🌀</span>";
                    cell.title = "Переход в другую локацию";
                }

                // Клик по клетке для перемещения
                cell.onclick = () => movePlayer(x, y);
                gridEl.appendChild(cell);
            }
        }
        updatePlayerPosition();
    }

    // Обновление визуала игрока на сетке
    function updatePlayerPosition() {
        playerEl.style.left = (playerX * cellSize + 8) + 'px';
        playerEl.style.top = (playerY * cellSize + 8) + 'px';
        
        // Проверка точки перехода
        let locData = locations[currentLoc];
        const moveActionsEl = document.getElementById('move-actions');
        
        if (playerX === locData.transitionCell.x && playerY === locData.transitionCell.y) {
            moveActionsEl.innerHTML = `<button class="btn" style="background-color: #2ed573;" onclick="switchLocation()">${locData.transitionText}</button>`;
        } else {
            moveActionsEl.innerHTML = '';
        }
    }

    // Логика пошагового перемещения рыбы по клеткам
    function movePlayer(targetX, targetY) {
        // Кэтвар позволяет ходить на соседние клетки (включая диагонали)
        const dx = Math.abs(targetX - playerX);
        const dy = Math.abs(targetY - playerY);
        
        if (dx <= 1 && dy <= 1) {
            playerX = targetX;
            playerY = targetY;
            updatePlayerPosition();
        } else {
            alert("Слишком далеко! Вы можете перемещаться только на соседние клетки.");
        }
    }

    // Смена локации (переход туда-сюда)
    function switchLocation() {
        let locData = locations[currentLoc];
        currentLoc = locData.targetLoc;
        
        document.getElementById('loc-name').innerText = locations[currentLoc].name;
        
        // При переходе ставим игрока на клетку с переходом новой локации
        playerX = locations[currentLoc].transitionCell.x;
        playerY = locations[currentLoc].transitionCell.y;
        
        initGrid();
    }

    // Прокачка навыков действиями
    function doAction(type) {
        if (type === 'swim') {
            if(stats.stamina < 100) stats.stamina += 5;
            if(stats.stamina > 100) stats.stamina = 100;
        } else if (type === 'look') {
            if(stats.perception < 100) stats.perception += 5;
            if(stats.perception > 100) stats.perception = 100;
        }
        updateStatsVisual();
    }

    // Обновление баров навыков в интерфейсе и профиле
    function updateStatsVisual() {
        document.getElementById('txt-stamina').innerText = stats.stamina;
        document.getElementById('bar-stamina').style.width = stats.stamina + '%';
        document.getElementById('prof-stamina').innerText = stats.stamina;

        document.getElementById('txt-perception').innerText = stats.perception;
        document.getElementById('bar-perception').style.width = stats.perception + '%';
        document.getElementById('prof-perception').innerText = stats.perception;
    }

    // Открытие/закрытие профиля
    function toggleProfile(show) {
        const displayState = show ? 'block' : 'none';
        document.getElementById('profile-modal').style.display = displayState;
        document.getElementById('modal-overlay').style.display = displayState;
    }

    // Старт игры
    initGrid();
    updateStatsVisual();
</script>

</body>
</html>
